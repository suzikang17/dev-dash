name: idea
dir: ideas
heading: Ideas
id: { strategy: sequential, pad: 4 }
body: free
groupBy: { field: status, order: [raw, promising, promoted, parked] }
frontmatter:
  - { name: title, type: string, required: true }
  - { name: status, type: enum, values: [raw, promising, promoted, parked], required: true }
  - { name: category, type: enum, values: [engineering, design, product, growth, ops, other] }
  - { name: effort, type: enum, values: [quick, small, medium, large] }
  - { name: promoted_to, type: string }
  - { name: created, type: date }
index:
  - { header: "#", source: id }
  - { header: Idea, source: title, link: true }
  - { header: Status, source: status }
  - { header: Category, source: category }
  - { header: Promoted To, source: promoted_to }
prompt: |
  You are capturing a product or engineering idea. Given a title, produce the markdown body only (no frontmatter).

  Structure:
  - Start with 1-2 sentences on what the idea is and why it's interesting.
  - ## Problem — what problem does this solve? Who feels the pain?
  - ## Rough shape — what would this look like if built? Keep it loose — bullets, not specs.
  - ## Open questions — what needs answering before this becomes a task?

  Keep it lightweight. This is a capture, not a spec. Leave rough edges.
